<!doctype html><html lang="it"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"><title>Easy RT Utility</title><style>
:root{--navy:#082959;--magenta:#e5007e;--line:#d9e2ec}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;font:14px Segoe UI,system-ui,sans-serif;color:var(--navy)}.bar{height:88px;display:flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(8,41,89,.06)}.brand{display:flex;align-items:center;gap:12px;min-width:310px}.brand>img{width:235px;height:55px;object-fit:contain;object-position:left center}.ver{padding:5px 9px;border-radius:999px;background:#edf3f9;font-size:11px;font-weight:800;color:#6c7b8f}.spacer{flex:1}.toolbar{display:flex;gap:8px;align-items:center}button{min-width:88px;height:54px;border:1px solid #d7e0e9;border-radius:18px;padding:7px 13px;background:#fff;color:var(--navy);font:inherit;font-weight:750;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(8,41,89,.05);transition:.16s}button:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(8,41,89,.10);background:#f8fbfe}.icon{font-size:20px;line-height:1}.brandicon{width:58px;height:22px;object-fit:contain}.homeicon{width:23px;height:23px}.portal{border-color:#efc4dc}.portal:hover{background:#fff4fa}@media(max-width:850px){.bar{padding:8px}.brand{min-width:auto}.brand>img{width:170px}.ver{display:none}button{min-width:60px;padding:6px 9px;font-size:12px}.toolbar{gap:5px}}
@media(max-width:1050px){.toolbar button{padding:8px;font-size:12px}.toolbar{gap:5px}.brand img{max-width:140px}}@media(max-width:700px){.toolbar button span:not(.icon){display:none}.toolbar button{min-width:34px}.brand img{max-width:110px}}
</style></head><body><div class="bar"><div class="brand"><img src="custom-logo.png" alt="CUSTOM"><span class="ver">0.1.33</span></div><div class="spacer"></div><div class="toolbar"><button id="back"><span class="icon" aria-hidden="true">←</span><span>Indietro</span></button><button id="home"><svg class="homeicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg><span>Easy RT</span></button><button id="portal" class="portal"><img class="brandicon" src="custom-logo.png" alt=""><span>Custom Hub</span></button><button id="updates" title="Aggiornamenti"><span class="icon" aria-hidden="true">↻</span><span>Aggiornamenti</span></button><button id="close" title="Chiudi applicazione"><span class="icon" aria-hidden="true">×</span><span>Chiudi applicazione</span></button><button id="info"><span class="icon" aria-hidden="true">ⓘ</span><span>Info</span></button></div></div><script src="shell.js"></script></body></html>
